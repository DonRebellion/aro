<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrigado — aro</title>
<meta name="description" content="Mensagem enviada com sucesso.">
<meta name="theme-color" content="#2A1B33">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body class="escuro" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

<header class="cabecalho">
  <div class="envolve cabecalho__interior">
    <a class="marca" href="index.html"><img src="assets/logo/aro-logo-sand.svg" alt="aro" width="96" height="39"></a>
  </div>
</header>

<main id="conteudo" style="display: grid; place-items: center; padding-block: 4rem; background: var(--tinta-2);">
  <section class="envolve texto centro" style="max-width: 42ch;">
    <span class="sobrancelha">Mensagem enviada</span>
    <h1>Obrigado.</h1>
    <p class="entrada" style="margin-inline: auto; margin-bottom: 2rem;">
      A sua mensagem foi enviada com sucesso. Entraremos em contacto brevemente.
    </p>
    <div class="botoes" style="justify-content: center;">
      <a class="botao botao--acento" href="index.html">Voltar ao início</a>
    </div>
  </section>
</main>

<footer class="rodape" style="border-top: 1px solid rgba(244,235,221,.12);">
  <div class="envolve" style="text-align: center;">
    <div class="rodape__base" style="justify-content: center;">
      <span>© 2026 aro</span>
      <span>ARO-100 · protótipo em aço inox</span>
    </div>
  </div>
</footer>

</body>
</html>
